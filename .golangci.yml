version: "2"
linters:
  default: all
  disable:
    - cyclop            # covered by gocyclo
    - depguard          # unnecessary for small libraries
    - err113            # dubious dynamic errors warnings
    - exhaustive        # many exceptions
    - exhaustruct       # many exceptions
    - exhaustruct_v5    # many exceptions
    - funlen            # rely on code review to limit function length
    - gochecknoglobals  # many exceptions
    - gocognit          # dubious "cognitive overhead" quantification
    - gomodguard        # replaced by gomodguard_v2
    - ireturn           # "accept interfaces, return structs" isn't ironclad
    - lll               # don't want hard limits for line length
    - maintidx          # covered by gocyclo
    - mnd               # some unnamed constants are okay
    - nilnil            # we allow this
    - noinlineerr       # excess scope violates house style
    - nlreturn          # generous whitespace violates house style
    - tagalign          # false positives
    - testpackage       # internal tests are fine
    - thelper           # we want to print out the whole stack
    - wrapcheck         # don't _always_ need to wrap errors
    - wsl               # generous whitespace violates house style
    - wsl_v5            # generous whitespace violates house style
  settings:
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print
        - pattern: ^log\.
        - pattern: ^print$
        - pattern: ^println$
        - pattern: ^panic$
    godox:
      # TODO, OPT, etc. comments are fine to commit. Use FIXME comments for
      # temporary hacks, and use godox to prevent committing them.
      keywords:
        - FIXME
    varnamelen:
      ignore-decls:
        - T any
        - i int
        - wg sync.WaitGroup
        - sb strings.Builder
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
          - prealloc
          - varnamelen
        path: cmd/protoc-gen-pluginrpc-go/main.go
      - linters:
          - varnamelen
        path: pluginrpc_test.go
      - linters:
          - gosec
        path: runner.go
      - linters:
          - gosec
        path: code.go
        text: "G115:"
      - linters:
          - gosec
        path: internal/example/cmd/echo-plugin/main.go
        text: "G115:"
      - linters:
          - gosec
        path: pluginrpc_test.go
        text: "G115:"
      - linters:
          - gocritic
        path: server.go
      - linters:
          - nestif
        path: wire.go
formatters:
  # gofumpt is not enabled: prefer standard gofmt.
  # goimports is not enabled: rely on gci instead.
  enable:
    - gci
    - gofmt
  exclusions:
    generated: lax
